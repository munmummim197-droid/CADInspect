name: Build

on:
  push:
    branches: [main, ci/optimize-actions]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-test:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\.cache\vcpkg-binary
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.cache\vcpkg-binary,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify toolchain
        id: toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            throw "The GitHub-hosted vcpkg checkout was not found."
          }
          cmake --version
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          $vcpkgCommit = git -C $env:VCPKG_ROOT rev-parse HEAD
          "vcpkg_commit=$vcpkgCommit" >> $env:GITHUB_OUTPUT
          "image_version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-vs2022-${{ steps.toolchain.outputs.image_version }}-${{ steps.toolchain.outputs.vcpkg_commit }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-vs2022-${{ steps.toolchain.outputs.image_version }}-${{ steps.toolchain.outputs.vcpkg_commit }}-

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_BINARY_CACHE | Out-Null
          "vcpkg cache hit: ${{ steps.vcpkg-cache.outputs.cache-hit }}"

      - name: Configure Release
        run: cmake --preset oss-release

      - name: Verify Release-only dependencies
        shell: pwsh
        run: |
          $debugTree = Join-Path $env:GITHUB_WORKSPACE 'vcpkg_installed\x64-windows-release-ci\debug'
          if (Test-Path -LiteralPath $debugTree) {
            throw "Release CI unexpectedly installed Debug dependency artifacts: $debugTree"
          }

      - name: Build Release
        run: cmake --build --preset oss-release --parallel

      - name: Test Release
        run: ctest --preset oss-release

      - name: Verify project PE metadata and unsigned status
        shell: pwsh
        run: |
          $expected = @(
            @{
              Path = '.\build\vs-oss-release\apps\gui\Release\CADInspect.exe'
              Description = 'CADInspect'
              OriginalFilename = 'CADInspect.exe'
            },
            @{
              Path = '.\build\vs-oss-release\apps\cli\Release\stepcompare-cli.exe'
              Description = 'CADInspect CLI'
              OriginalFilename = 'stepcompare-cli.exe'
            }
          )
          foreach ($item in $expected) {
            $file = Get-Item -LiteralPath $item.Path
            $metadata = $file.VersionInfo
            if ($metadata.FileDescription -ne $item.Description -or
                $metadata.ProductName -ne 'CADInspect' -or
                $metadata.FileVersion -ne '0.1.0.0' -or
                $metadata.ProductVersion -ne '0.1.0' -or
                $metadata.CompanyName -ne 'CADInspect Project' -or
                $metadata.LegalCopyright -ne 'Copyright (c) 2026 CADInspect contributors' -or
                $metadata.OriginalFilename -ne $item.OriginalFilename) {
              throw "PE metadata mismatch: $($item.Path)"
            }
            if ((Get-AuthenticodeSignature -LiteralPath $file.FullName).Status -ne 'NotSigned') {
              throw "Expected unsigned project PE: $($item.Path)"
            }
          }

      - name: Confirm source-only workspace policy
        shell: pwsh
        run: |
          git status --short
          if (git ls-files | Select-String -Pattern '\.(exe|dll|pdb|msi|zip|7z)$') {
            throw "Generated binary/archive is tracked."
          }

      - name: Package unsigned Release runtime
        shell: pwsh
        run: |
          .\scripts\New-StepComparePortablePackage.ps1 `
            -SkipBuild `
            -Preset oss-release `
            -BuildDirectory 'build\vs-oss-release' `
            -Triplet 'x64-windows-release-ci'

      - name: Build unsigned installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned runner Inno Setup compiler is missing: $iscc"
          }
          & $iscc /Qp .\installer\CADInspect.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = Get-Item -LiteralPath `
            '.\release-installer\CADInspect-Setup-x64-0.1.0.exe'
          $expectedMetadata = [ordered]@{
            ProductName = 'CADInspect'
            FileVersion = '0.1.0.0'
            ProductVersion = '0.1.0'
            CompanyName = 'CADInspect Project'
            OriginalFilename = $installer.Name
          }
          $metadataMismatches = @()
          foreach ($field in $expectedMetadata.Keys) {
            $actualRaw = $installer.VersionInfo.$field
            $expectedRaw = $expectedMetadata[$field]
            $actualText = if ($null -eq $actualRaw) { $null } else { [string]$actualRaw }
            $expectedText = if ($null -eq $expectedRaw) { $null } else { [string]$expectedRaw }
            $actualNormalized = if ($null -eq $actualText) { $null } else { $actualText.Trim() }
            $expectedNormalized = if ($null -eq $expectedText) { $null } else { $expectedText.Trim() }
            $matches = -not [string]::IsNullOrWhiteSpace($actualText) -and
              -not [string]::IsNullOrWhiteSpace($expectedText) -and
              [string]::Equals(
                $actualNormalized,
                $expectedNormalized,
                [System.StringComparison]::Ordinal)
            if (-not $matches) {
              $metadataMismatches += [pscustomobject]@{
                Field = $field
                Expected = $expectedText
                Actual = $actualText
                ExpectedLength = if ($null -eq $expectedText) { '<null>' } else { $expectedText.Length }
                ActualLength = if ($null -eq $actualText) { '<null>' } else { $actualText.Length }
              }
            }
          }
          if ($metadataMismatches.Count -gt 0) {
            Write-Host 'Installer PE metadata mismatch:'
            foreach ($mismatch in $metadataMismatches) {
              $expectedDisplay = if ($null -eq $mismatch.Expected) { '<null>' } else { $mismatch.Expected }
              $actualDisplay = if ($null -eq $mismatch.Actual) { '<null>' } else { $mismatch.Actual }
              Write-Host "Field: $($mismatch.Field)"
              Write-Host "Expected: [$expectedDisplay]"
              Write-Host "Actual:   [$actualDisplay]"
              Write-Host "ExpectedLength: $($mismatch.ExpectedLength)"
              Write-Host "ActualLength: $($mismatch.ActualLength)"
            }
            throw 'Installer PE metadata mismatch.'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'NotSigned') {
            throw 'Expected unsigned installer before the future signing boundary.'
          }

      - name: Assemble commit-bound unsigned artifact
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP `
            "cadinspect-0.1.0-unsigned-${{ github.sha }}"
          .\scripts\New-CADInspectTrustedArtifact.ps1 `
            -PackageRoot .\dist `
            -InstallerPath .\release-installer\CADInspect-Setup-x64-0.1.0.exe `
            -Destination $artifactRoot `
            -CommitSha '${{ github.sha }}' `
            -WorkflowRunId '${{ github.run_id }}'

      - name: Upload commit-bound unsigned artifact
        id: unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadinspect-0.1.0-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}\cadinspect-0.1.0-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
